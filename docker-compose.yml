services:
  server:
    container_name: linked-code-server
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runner
    environment:
      - MONGO_URI=mongodb://mongo:27017/LinkedCode
      - JWT_SECRET=${JWT_SECRET:-linkedcode-dev-secret-change-me}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./server:/app
      - /build/node_modules
    networks:
      - Linked-Code
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  mongo:
    container_name: linked-code-mongo
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - Linked-Code
    ports:
      - "27017:27017"

  client:
    container_name: linked-code-client
    build:
      context: ./client
      dockerfile: Dockerfile
      target: runner
    volumes:
      - ./client:/app
      - /build/node_modules
    networks:
      - Linked-Code
    ports:
      - "5173:5173"
    depends_on:
      - server

networks:
  Linked-Code:
    driver: bridge

volumes:
  mongo-data:
